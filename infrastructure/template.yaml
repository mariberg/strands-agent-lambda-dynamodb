AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Minimal demo stack: Lambda + Function URL + DynamoDB tables.

Parameters:
  Environment:
    Type: String
    Default: demo
  DemoGardenId:
    Type: String
    Default: demo-garden-1
    Description: Hardcoded garden_id injected by the demo middleware
  DemoUserId:
    Type: String
    Default: demo-user-1
    Description: Hardcoded user_id injected by the demo middleware
  BedrockRegion:
    Type: String
    Default: us-east-1
    Description: AWS region for Bedrock model access
  CodeS3Bucket:
    Type: String
    Default: ""
    Description: S3 bucket containing Lambda deployment zip (leave empty for inline placeholder)
  CodeS3Key:
    Type: String
    Default: ""
    Description: S3 key for Lambda deployment zip

Conditions:
  HasS3Code: !Not [!Equals [!Ref CodeS3Bucket, ""]]

Resources:

  # ── DynamoDB Table ─────────────────────────────────────────────────────────
  # Single-table design. All entity types share one table using prefixed keys:
  #   PK=GARDEN#<id>   SK=PLANT#<id> | LOG#<id>#<ts> | PHOTO#<id>#<ts> | WATERING#<date>#<id> | DASHBOARD | METADATA
  #   PK=USER#<id>     SK=PROFILE
  #   PK=SPECIES#<id>  SK=METADATA | CARE#<instruction_id>

  GardenAppTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "GardenApp-${Environment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE

  # ── IAM Role ───────────────────────────────────────────────────────────────

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "strands-demo-lambda-role-${Environment}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt GardenAppTable.Arn
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource: "*"
        - PolicyName: LambdaSelfInvoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub "arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:strands-demo-api-${Environment}"

  # ── Lambda Function ────────────────────────────────────────────────────────

  ApiFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "strands-demo-api-${Environment}"
      Runtime: python3.12
      Handler: src.api.router.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 300
      MemorySize: 256
      Code:
        !If
          - HasS3Code
          - S3Bucket: !Ref CodeS3Bucket
            S3Key: !Ref CodeS3Key
          - ZipFile: |
              def lambda_handler(event, context):
                  return {"statusCode": 200, "body": "placeholder — deploy real code"}
      Environment:
        Variables:
          TABLE_NAME: !Ref GardenAppTable
          BEDROCK_REGION: !Ref BedrockRegion
          DEMO_GARDEN_ID: !Ref DemoGardenId
          DEMO_USER_ID: !Ref DemoUserId
          POWERTOOLS_SERVICE_NAME: strands-demo
          LAMBDA_FUNCTION_NAME: !Sub "strands-demo-api-${Environment}"

  # ── Lambda Function URL (no auth — easy curl) ──────────────────────────────

  ApiFunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref ApiFunction
      AuthType: NONE
      Cors:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"

  ApiFunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  ApiFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ApiFunction
      Action: lambda:InvokeFunction
      Principal: "*"

Outputs:
  FunctionUrl:
    Description: Lambda Function URL — use this as your base URL for curl
    Value: !GetAtt ApiFunctionUrl.FunctionUrl
  GardenAppTableName:
    Value: !Ref GardenAppTable
